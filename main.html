<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 role="heading">My Portfolio</h1>
    </header>

    <nav role="navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">

        <section id="about">
            <h2>About Me</h2>

            <img
                src="https://via.placeholder.com/200"
                alt="Profile picture"
                role="img"
            >

            <p>
                Hello! I am a passionate developer interested in
                web development, artificial intelligence, and
                creating useful applications.
            </p>
        </section>

        <section id="projects">
            <h2>My Skills</h2>

            <ul role="list">
                <li role="listitem">HTML and CSS</li>
                <li role="listitem">JavaScript and React</li>
                <li role="listitem">Python and AI/ML</li>
            </ul>
        </section>

    </main>

</body>
</html>
